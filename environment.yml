name: "ML_ORD"
channels:
  - conda-forge
  - bioconda
  - pytorch
  - defaults
dependencies:
  - "python<=3.10"
  - r-base=3.6
  - r-renv
  - pandas
  - "numpy<1.26.0"
  - scikit-learn
  - lifelines
  - scikeras
  - pytensor
  - "pytorch>=1.4"
  - matplotlib
  - r-essentials
  - pip
  - pip:
    - "numpy<1.26.0"
    - tensorflow-cpu
prefix: /opt/miniconda3/envs/ML_ORD